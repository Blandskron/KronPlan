<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="KronPlan — Agile Planning &amp; Estimation · Open Source by BLANDSKRON">
  <defs>
    <radialGradient id="og-glow-1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 90) rotate(35) scale(620 420)">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0D1020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-glow-2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1030 520) rotate(-145) scale(560 400)">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0D1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0D1020"/>
  <rect width="1200" height="630" fill="url(#og-glow-1)"/>
  <rect width="1200" height="630" fill="url(#og-glow-2)"/>

  <!-- Subtle architectural grid -->
  <g stroke="#34314D" stroke-opacity="0.35" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="88" y1="0" x2="88" y2="630"/>
    <line x1="1112" y1="0" x2="1112" y2="630"/>
  </g>

  <!-- Brand Mark -->
  <g transform="translate(88 128) scale(1.35)">
    <g transform="rotate(-11 28 34)">
      <rect x="10" y="10" width="34" height="44" rx="8" fill="#17182D" stroke="#A78BFA" stroke-width="2" stroke-opacity="0.72"/>
    </g>
    <g transform="rotate(4 36 32)">
      <rect x="18" y="8" width="36" height="48" rx="9" fill="url(#og-card)" stroke="#DDD6FE" stroke-width="1.5" stroke-opacity="0.55"/>
      <path d="M27.5 21.5V42.5" stroke="#F5F7FB" stroke-width="4" stroke-linecap="round"/>
      <path d="M41.5 21.5L31.2 31.8L42 42.5" stroke="#F5F7FB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M45.5 14.5L47.5 16.5L45.5 18.5L43.5 16.5Z" fill="#22D3EE"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="92" y="294" fill="#F5F7FB" font-family="Sora, Inter, ui-sans-serif, system-ui, sans-serif" font-size="74" font-weight="800" letter-spacing="-2.4">Kron<tspan fill="#A78BFA">Plan</tspan></text>
  <text x="94" y="346" fill="#22D3EE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="3.2">AGILE PLANNING &amp; ESTIMATION</text>
  <text x="94" y="410" fill="#B8B3CD" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="500">Plan together. Build better.</text>

  <!-- Signature Pill -->
  <rect x="92" y="468" width="336" height="44" rx="22" fill="#17182D" stroke="#34314D" stroke-width="1.5"/>
  <circle cx="118" cy="490" r="5" fill="#22C55E"/>
  <text x="136" y="496" fill="#DDD6FE" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="700" letter-spacing="1.4">OPEN SOURCE · BY BLANDSKRON</text>

  <!-- Right Fanned Poker Cards Showcase -->
  <g transform="translate(800 175)">
    <g transform="rotate(-14 60 150)">
      <rect x="0" y="20" width="136" height="196" rx="16" fill="#211F38" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="2"/>
      <rect x="12" y="32" width="112" height="172" rx="10" stroke="#DDD6FE" stroke-opacity="0.16" stroke-width="1.5"/>
      <text x="68" y="136" text-anchor="middle" fill="#DDD6FE" font-family="JetBrains Mono, ui-monospace, monospace" font-size="60" font-weight="800">3</text>
    </g>
    <g transform="translate(92 -12) rotate(-2 68 110)">
      <rect x="0" y="10" width="144" height="206" rx="16" fill="#F8F7FC" stroke="#DDD6FE" stroke-width="2"/>
      <rect x="12" y="22" width="120" height="182" rx="10" stroke="#6366F1" stroke-opacity="0.22" stroke-width="1.5"/>
      <text x="72" y="132" text-anchor="middle" fill="#121024" font-family="JetBrains Mono, ui-monospace, monospace" font-size="68" font-weight="800">5</text>
      <text x="116" y="192" fill="#7C3AED" font-family="Sora, sans-serif" font-size="14" font-weight="800">K</text>
    </g>
    <g transform="translate(184 18) rotate(12 68 110)">
      <rect x="0" y="10" width="136" height="196" rx="16" fill="url(#og-card)" stroke="#DDD6FE" stroke-opacity="0.6" stroke-width="2"/>
      <rect x="12" y="22" width="112" height="172" rx="10" stroke="#F5F7FB" stroke-opacity="0.28" stroke-width="1.5"/>
      <text x="68" y="128" text-anchor="middle" fill="#F5F7FB" font-family="JetBrains Mono, ui-monospace, monospace" font-size="60" font-weight="800">8</text>
    </g>
  </g>
</svg>
