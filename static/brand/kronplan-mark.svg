<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="KronPlan isotipo">
  <defs>
    <linearGradient id="kp-card-bg" x1="12" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="58%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="kp-back-card" x1="8" y1="10" x2="42" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34314D"/>
      <stop offset="100%" stop-color="#17182D"/>
    </linearGradient>
  </defs>
  <!-- Back planning card -->
  <g transform="rotate(-11 28 34)">
    <rect x="10" y="10" width="34" height="44" rx="8" fill="url(#kp-back-card)" stroke="#A78BFA" stroke-width="2" stroke-opacity="0.72"/>
    <rect x="14.5" y="14.5" width="25" height="35" rx="4.5" stroke="#DDD6FE" stroke-width="1" stroke-opacity="0.22"/>
  </g>
  <!-- Front planning card -->
  <g transform="rotate(4 36 32)">
    <rect x="18" y="8" width="36" height="48" rx="9" fill="url(#kp-card-bg)" stroke="#DDD6FE" stroke-width="1.5" stroke-opacity="0.55"/>
    <rect x="22" y="12" width="28" height="40" rx="5.5" stroke="#F5F7FB" stroke-width="1" stroke-opacity="0.24"/>
    <!-- Geometric K integrated with card geometry -->
    <path d="M27.5 21.5V42.5" stroke="#F5F7FB" stroke-width="4" stroke-linecap="round"/>
    <path d="M41.5 21.5L31.2 31.8L42 42.5" stroke="#F5F7FB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Velocity Cyan diamond pip -->
